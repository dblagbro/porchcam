# porchcam now encodes on the GPU (MJPEG in, H.264 VAAPI out) because the C920's
# onboard H.264 provides no frame timestamps and a fixed 10s GOP. Encoding needs
# the DRM render node, which the stock unit does not grant - deskcam-capture has
# had exactly these two lines since it was written.
[Service]
SupplementaryGroups=render
DeviceAllow=char-drm rw
