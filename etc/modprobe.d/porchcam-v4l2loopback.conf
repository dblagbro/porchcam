# Virtual camera for video conferencing, fed by deskcam-capture.
# video_nr=10 is pinned deliberately: the real cameras occupy /dev/video0-3, and
# an auto-assigned number could land on top of them after a USB re-enumeration.
# exclusive_caps=1 makes the node advertise CAPTURE only, which is what Chrome,
# Zoom and Teams require before they will list it as a webcam.
options v4l2loopback devices=1 video_nr=10 card_label="Deskcam (virtual)" exclusive_caps=1 max_buffers=2
